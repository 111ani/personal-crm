# App: proxies app.lena-14.ru to the app container on 127.0.0.1:3000
# (deploy/compose.yaml). Installed once by hand as
# /etc/nginx/sites-available/app.lena-14.ru; deploys do not change it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.lena-14.ru;
    include snippets/lena-14-ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Send parts of the page as soon as they are ready (React Suspense)
        proxy_buffering off;
    }
}
