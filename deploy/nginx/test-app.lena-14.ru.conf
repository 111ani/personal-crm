# Installed as /etc/nginx/sites-available/test-app.lena-14.ru.
server {
    listen 80;
    listen [::]:80;
    server_name test-app.lena-14.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/test-app.lena-14.ru;
        try_files $uri =404;
    }

    location / {
        return 301 https://test-app.lena-14.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.lena-14.ru;
    ssl_certificate /etc/letsencrypt/live/test-app.lena-14.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.lena-14.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "CRM staging";
    auth_basic_user_file /etc/nginx/test-app.lena-14.ru.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }

    # The deploy script checks only this path from the local server.
    location = /health {
        satisfy any;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3001;
    }
}
