# Checks of every PR into main: lint, format, types, Vitest, Playwright and
# the image build. Each job is a required check of main: a PR merges only
# when all of them are green.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the PR cancels the run for the outdated commit
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Throwaway Postgres of the job (see services below): no password, so no
  # secret here. Test databases crm_test and crm_e2e are created from it
  DATABASE_URL: postgresql://postgres@localhost:5432/crm

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field of package.json
      - uses: pnpm/action-setup@v6

      # Node 24, as in the Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds the app and starts it on the e2e database (playwright.config.ts)
      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      # Report, traces and screenshots of a failed run, to download from the run page
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the image builds; deploy.yml builds and pushes it
      # to GHCR after the merge
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
