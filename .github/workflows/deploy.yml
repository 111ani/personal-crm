# Build one image per SHA and deploy it to staging.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/111ani/personal-crm

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the SHA is already published
        id: image
        run: |
          reference="$IMAGE:$GITHUB_SHA"
          if result=$(docker buildx imagetools inspect "$reference" 2>&1); then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif grep -Fq "$reference: not found" <<< "$result"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi

      - uses: docker/build-push-action@v7
        if: steps.image.outputs.build == 'true'
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test-app.lena-14.ru
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: /srv/personal-crm/staging
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy scripts to the server
        run: rsync -rltz --delete deploy/ "$TARGET:$DEPLOY_DIR/deploy/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            ssh "$TARGET" bash "$DEPLOY_DIR/deploy/deploy.sh" staging "$GITHUB_SHA" "$GITHUB_ACTOR"
